<html>
    <head>
        <title><center>Lists</center></title>
    </head>
    <body>
        <h1><center><u>Lists</u></center></h1>
        <hr>
        <h2>Ordered List</h2>
        <ol>
            <li>Apple</li>
            <li>Mango</li>
            <li>Orange</li>
        </ol>

        <h2>Unordered list</h2>
        <ul>
            <li>Cat</li>
            <li>Dog</li>
            <li>Tiger</li>
        </ul>
    </body>
</html>
